<h2>Listado de productos</h2>
<div *ngIf="cargando">Cargando...</div>
<table *ngIf="!cargando && productos.length > 0" border="1">
  <thead>
    <tr>
      <th>Id</th>
      <th>Nombre</th>
      <th>Precio</th>

    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let p of productos">
      <td>{{p.id }}</td>
      <td>{{p.nombre }}</td>
      <td>{{p.precio }}</td>
    </tr>
  </tbody>
</table>
<div *ngIf="!cargando && productos.length == 0">No hay productos para mostrar</div>
